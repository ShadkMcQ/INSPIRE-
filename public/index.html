<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INSPIRE | Come Up Higher</title><style>
:root{--ink:#25292b;--gold:#c7a67a;--cream:#faf7f1;--lav:#eee7f3;--violet:#8766a0}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:16px/1.5 system-ui,Arial;color:var(--ink)}header{background:linear-gradient(130deg,#25292b,#35303e);color:white;padding:34px 20px;border-bottom:5px solid var(--gold)}.wrap{max-width:1000px;margin:auto;padding:0 20px}.eyebrow{letter-spacing:.25em;color:var(--gold);font-size:12px;font-weight:700}h1{font-family:Georgia,serif;font-size:clamp(38px,7vw,76px);font-weight:400;line-height:1.04;margin:12px 0}h2{font-family:Georgia,serif;font-weight:400;font-size:32px;margin:0 0 14px}h3{margin:8px 0}.sub{color:#d6c8dc}main{padding:28px 0 70px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 25px}.nav a{color:var(--ink);text-decoration:none;border:1px solid #d6ccd9;border-radius:50px;padding:9px 16px;background:white;font-size:14px}.nav a.on{background:var(--ink);color:white}.panel{background:white;border:1px solid #e7e0e4;border-radius:18px;padding:clamp(18px,4vw,34px);box-shadow:0 14px 36px #28232d0c;margin:16px 0}.label{font-size:12px;letter-spacing:.14em;color:var(--violet);font-weight:800;text-transform:uppercase}input,textarea,select{display:block;width:100%;font:inherit;border:1px solid #d8d1dc;border-radius:9px;padding:12px;margin:6px 0 15px;background:#fff}textarea{min-height:115px}label{font-weight:650;font-size:14px}.btn{background:var(--ink);color:white;border:0;border-radius:9px;padding:12px 19px;font:inherit;cursor:pointer;margin:4px 5px 4px 0}.btn.gold{background:#9d7748}.btn.soft{background:var(--lav);color:var(--ink)}.btn:disabled{opacity:.4}.muted{color:#736e79;font-size:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{border:1px solid #e3dce6;border-radius:12px;padding:16px;background:#fcfafc}.status{display:inline-block;padding:4px 9px;background:#efe5d4;border-radius:40px;font-size:12px}.answer{padding:14px;border:1px solid #e7dce9;border-radius:12px;margin:9px 0;overflow-wrap:anywhere}.answer.featured{border:2px solid var(--gold);background:#fffaf1}.options{display:grid;gap:8px;margin:12px 0}.options label{padding:12px;background:var(--lav);border-radius:8px}.options input{display:inline;width:auto;margin:0 10px 0 0}.notice{border-left:4px solid var(--gold);padding:10px 16px;background:#fff9ee;margin:16px 0}.hidden{display:none}.bar{height:11px;background:var(--lav);border-radius:20px;overflow:hidden}.bar b{display:block;height:100%;background:var(--violet)}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.word{display:inline-block;margin:8px;color:var(--violet);font-family:Georgia,serif}.actions{display:flex;flex-wrap:wrap;gap:5px}@media(max-width:650px){.split{grid-template-columns:1fr}header{padding:28px 0}}@media print{header,.nav,.btn,.no-print{display:none!important}body{background:white}.panel{box-shadow:none}}
</style></head><body><header><div class="wrap"><div class="eyebrow">MARSHA LEWIS · INSPIRE26</div><h1>Come Up<br><span style="color:var(--gold)">Higher.</span></h1><div class="sub">Reveal · Realign · Embody & Own</div></div></header><main class="wrap"><nav class="nav"><a href="/" id="nav-participant">Participant</a><a href="/?view=facilitator" id="nav-facilitator">Facilitator</a><a href="/?view=screen" id="nav-screen">Presentation screen</a></nav><div id="app"></div></main><script>
const $=s=>document.querySelector(s),app=$('#app'),view=new URLSearchParams(location.search).get('view')||'participant';$('#nav-'+view)?.classList.add('on');const CODE='INSPIRE26';let token=sessionStorage.getItem('inspire_token')||'',dashboard=null,activeQuestion=null;let participant=localStorage.getItem('inspire_participant');if(!participant){participant='p_'+crypto.randomUUID().replace(/-/g,'');localStorage.setItem('inspire_participant',participant)}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async(path,method='GET',data)=>{let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:data?JSON.stringify(data):undefined});let j=await r.json().catch(()=>({error:'Unable to reach server'}));if(!r.ok)throw Error(j.error||'Request failed');return j};const notice=(msg)=>'<div class="notice">'+esc(msg)+'</div>';function error(e){$('#feedback')?$('#feedback').textContent=e.message:alert(e.message)}function optionInputs(q){if(['poll','quiz'].includes(q.type)&&q.options?.length)return '<div class="options">'+(q.options||[]).map(o=>`<label><input type="radio" name="answer" value="${esc(o)}">${esc(o)}</label>`).join('')+'</div>';if(q.type==='scale')return '<label>Choose 1–10 <select id="answer">'+Array.from({length:10},(_,i)=>`<option>${i+1}</option>`).join('')+'</select></label>';return '<label>Your response<textarea id="answer" maxlength="1200" placeholder="Take a moment to reflect..."></textarea></label>'}
async function participantView(){try{const r=await api('join?code='+CODE);activeQuestion=r.question;app.innerHTML=`<section class="panel"><div class="label">Your space to reflect</div><h2>Welcome to INSPIRE</h2><p>There is no right way to come up higher. Take a moment to consider what matters to you.</p>${r.question?`<div class="label">${esc(r.question.type)} · ${esc(r.question.visibility)} response</div><h2>${esc(r.question.title)}</h2><form id="response-form">${optionInputs(r.question)}${r.question.identity_mode!=='anonymous'?`<label>Name ${r.question.identity_mode==='named'?'(required)':'(optional)'}<input id="name" maxlength="80" ${r.question.identity_mode==='named'?'required':''} placeholder="Your name"></label>`:''}<button class="btn gold" type="submit">Share response</button></form>`:notice('Marsha will activate the next question shortly. Keep this page open.') }<div id="feedback" class="muted"></div><div id="qa-votes"></div></section><section class="panel"><div class="label">Your private journey</div><h2>My Come Up Higher takeaway</h2><p class="muted">These notes stay on this device unless you choose to submit them in a live question.</p>${[['reveal','REVEAL · An old pattern'],['realign','REALIGN · My guiding value'],['embody','EMBODY · My next courageous action'],['date','When I will take action']].map(([k,l])=>`<label>${l}${k==='date'?`<input type="date" data-note="${k}">`:`<textarea data-note="${k}" placeholder="Write for yourself..."></textarea>`}</label>`).join('')}<button class="btn soft" id="save-takeaway">Download my takeaway</button></section>`;document.querySelectorAll('[data-note]').forEach(el=>{el.value=localStorage.getItem('inspire_note_'+el.dataset.note)||'';el.oninput=()=>localStorage.setItem('inspire_note_'+el.dataset.note,el.value)});$('#save-takeaway').onclick=()=>{let txt='INSPIRE — COME UP HIGHER\nMARSHA LEWIS\n\n'+[...document.querySelectorAll('[data-note]')].map(x=>x.dataset.note.toUpperCase()+'\n'+x.value).join('\n\n');download('My_Come_Up_Higher_Takeaway.txt',txt)};if(r.question?.type==='qa'&&r.question.visibility!=='private'){api('wall?code='+CODE).then(w=>{const el=$('#qa-votes');if(!el)return;el.innerHTML='<h3>Questions from the room · Upvote</h3>'+w.responses.map(x=>`<div class="answer">${esc(x.answer)} <span class="muted">(${x.votes} votes)</span><button class="btn soft" data-upvote="${x.id}">▲ Upvote</button></div>`).join('');el.querySelectorAll('[data-upvote]').forEach(b=>b.onclick=async()=>{try{await api('upvote','POST',{code:CODE,question_id:r.question.id,response_id:b.dataset.upvote,participant_id:participant});participantView()}catch(ex){error(ex)}})}).catch(()=>{})}if($('#response-form'))$('#response-form').onsubmit=async e=>{e.preventDefault();let answer=['poll','quiz'].includes(r.question.type)&&r.question.options?.length?document.querySelector('input[name=answer]:checked')?.value:$('#answer').value;if(!answer){$('#feedback').textContent='Please enter or choose a response.';return}try{const result=await api('submit','POST',{code:CODE,question_id:r.question.id,participant_id:participant,answer,name:$('#name')?.value||''});$('#feedback').textContent='Response received.'+(r.question.type==='quiz'?' Your score: '+result.score+' / 1.':'');$('#response-form').reset()}catch(ex){error(ex)}}}catch(e){app.innerHTML=notice(e.message+' — The Netlify backend must be deployed and the facilitator must create the event first.')}}
function download(name,content){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type:'text/plain'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function adminLogin(){app.innerHTML=`<section class="panel"><div class="label">Private facilitator access</div><h2>Facilitator control room</h2><p>Enter the password set in your Netlify environment variables.</p><form id="login"><label>Facilitator password<input type="password" id="pass" required></label><button class="btn gold">Sign in</button></form><p id="feedback" class="muted"></p></section>`;$('#login').onsubmit=async e=>{e.preventDefault();try{token=(await api('login','POST',{password:$('#pass').value})).token;sessionStorage.setItem('inspire_token',token);adminView()}catch(ex){error(ex)}}}
async function adminView(){try{let events=await api('events');if(!events.events.length){app.innerHTML=`<section class="panel"><h2>Welcome, facilitator</h2><p>Set up the INSPIRE event with the three reflection questions, word cloud and Q&A.</p><button class="btn gold" id="create-event">Create INSPIRE event</button></section>`;$('#create-event').onclick=async()=>{try{await api('events','POST',{title:'INSPIRE — Come Up Higher'});adminView()}catch(ex){error(ex)}};return}dashboard=await api('dashboard?event_id='+CODE);let q=dashboard.questions,rs=dashboard.responses;app.innerHTML=`<div class="topline"><div><div class="label">INSPIRE · Control room</div><h2>Facilitator dashboard</h2></div><button class="btn soft" id="refresh">Refresh responses</button></div><div class="notice">Open facilitator access: anyone who knows this page URL can change questions and see responses. Do not share the facilitator link publicly.</div><div class="cards"><div class="card"><div class="label">Questions</div><h2>${q.length}</h2></div><div class="card"><div class="label">Responses</div><h2>${rs.length}</h2></div><div class="card"><div class="label">Awaiting approval</div><h2>${rs.filter(r=>!r.approved).length}</h2></div></div><section class="panel"><div class="topline"><h2>Question studio</h2><button class="btn gold" id="new-q">+ New question</button></div><div id="questions">${q.map(x=>`<div class="card" style="margin:10px 0"><div class="topline"><div><span class="label">${esc(x.type)} · ${esc(x.visibility)}</span> ${x.status==='active'?'<span class="status">ACTIVE</span>':''}<h3>${esc(x.title)}</h3></div><div class="actions"><button class="btn soft" data-edit="${x.id}">Edit</button><button class="btn gold" data-activate="${x.id}">Activate</button><button class="btn soft" data-delete="${x.id}">Delete</button></div></div></div>`).join('')}</div><button class="btn soft" id="close-q">Close active question</button></section><section class="panel"><h2>Live quiz leaderboard</h2><div>${(dashboard.leaderboard||[]).map((x,i)=>`<div class="answer">${i+1}. ${esc(x.name)} — <strong>${x.points} point(s)</strong></div>`).join('')||'Scores will appear when quiz answers arrive.'}</div></section><section class="panel"><h2>Responses</h2><button class="btn soft" id="export">Export CSV</button><div>${rs.length?rs.map(r=>{let x=q.find(x=>x.id===r.question_id);return `<div class="answer ${r.featured?'featured':''}"><div class="label">${esc(x?.type||'Question')} · ${esc(r.display_name||'Anonymous')} · ${r.approved?'Approved':'Pending'}</div><p>${esc(r.answer)}</p><div class="muted">${r.score!==null?'Score: '+r.score+' / 1 · ':''}${r.votes?'Upvotes: '+r.votes:''}</div><div class="actions"><button class="btn soft" data-approve="${r.id}" data-value="${!r.approved}">${r.approved?'Hide':'Approve'}</button><button class="btn soft" data-feature="${r.id}" data-value="${!r.featured}">${r.featured?'Remove spotlight':'Spotlight'}</button></div></div>`}).join(''):notice('Responses will appear here when participants submit.')}</div></section><section class="panel"><h2>Share your event</h2><p><strong>Participant:</strong> <a href="/" target="_blank">${esc(location.origin)}/</a></p><p><strong>Presentation:</strong> <a href="/?view=screen" target="_blank">${esc(location.origin)}/?view=screen</a></p><p class="muted">Share the participant link or generate a QR code for it. Never share your facilitator password.</p></section><div id="feedback" class="muted"></div>`;$('#refresh').onclick=adminView;$('#new-q').onclick=()=>questionForm();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>questionForm(q.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-activate]').forEach(b=>b.onclick=()=>adminAction('activate',{event_id:CODE,question_id:b.dataset.activate}));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this question and its responses?'))adminAction('delete-question',{event_id:CODE,question_id:b.dataset.delete})});$('#close-q').onclick=()=>adminAction('activate',{event_id:CODE,question_id:null});document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>adminAction('moderate',{event_id:CODE,response_id:b.dataset.approve,approved:b.dataset.value==='true'}));document.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>adminAction('moderate',{event_id:CODE,response_id:b.dataset.feature,featured:b.dataset.value==='true'}));$('#export').onclick=()=>{const rows=[['Question','Name','Response','Score','Upvotes','Approved','Spotlight'],...rs.map(r=>[q.find(x=>x.id===r.question_id)?.title||'',r.display_name||'Anonymous',r.answer,r.score??'',r.votes||0,r.approved,r.featured])];let csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('INSPIRE_Responses.csv','\ufeff'+csv)}}catch(e){if(e.message.includes('login')||e.message.includes('401')){token='';sessionStorage.removeItem('inspire_token');adminLogin()}else app.innerHTML=notice(e.message)}}
async function adminAction(path,data){try{await api(path,'POST',data);adminView()}catch(e){error(e)}}function questionForm(q={}){app.innerHTML=`<section class="panel"><div class="label">Question studio</div><h2>${q.id?'Edit':'Create'} a question</h2><form id="qform"><label>Question<textarea id="qtitle" required maxlength="400">${esc(q.title||'')}</textarea></label><div class="split"><label>Question type<select id="qtype">${['reflection','wordcloud','poll','quiz','qa','scale'].map(x=>`<option ${q.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Visibility<select id="qvis">${['private','moderated','live'].map(x=>`<option ${q.visibility===x?'selected':''}>${x}</option>`).join('')}</select></label></div><label>Participant identity<select id="qident">${['anonymous','optional','named'].map(x=>`<option ${q.identity_mode===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Answer choices (optional for poll/quiz; leave empty for free-text answers; one per line)<textarea id="qoptions" placeholder="Choice A&#10;Choice B">${esc((q.options||[]).join('\n'))}</textarea></label><label>Correct choice for quiz (1, 2, 3...; when using choices)<input type="number" min="1" id="correct-index" value="${q.correct_index===null||q.correct_index===undefined?'':q.correct_index+1}" placeholder="e.g. 1"></label><label>Correct text answer for quiz (when no choices)<input id="correct-answer" value="${esc(q.correct_answer||'')}" placeholder="Exact accepted answer"></label><button class="btn gold">Save question</button><button type="button" class="btn soft" id="cancel">Cancel</button></form><p id="feedback"></p></section>`;$('#cancel').onclick=adminView;$('#qform').onsubmit=async e=>{e.preventDefault();try{await api('question','POST',{event_id:CODE,id:q.id,title:$('#qtitle').value,type:$('#qtype').value,visibility:$('#qvis').value,identity_mode:$('#qident').value,options:$('#qoptions').value.split('\n').map(x=>x.trim()).filter(Boolean),correct_index:$('#correct-index').value?Number($('#correct-index').value)-1:null,correct_answer:$('#correct-answer').value});adminView()}catch(ex){error(ex)}}}
async function screenView(){try{let r=await api('wall?code='+CODE),q=r.question,rs=r.responses;app.innerHTML=`<section class="panel" style="min-height:400px"><div class="label">INSPIRE · Live reflections</div><h2>${q?esc(q.title):'The next conversation is coming...'}</h2>${!q?notice('Waiting for the facilitator to activate a question.'):q.visibility==='private'?notice('This reflection is private.'):q.type==='wordcloud'?'<div style="text-align:center;padding:30px">'+Object.entries(rs.reduce((a,r)=>(a[r.answer.toLowerCase()]=(a[r.answer.toLowerCase()]||0)+1,a),{})).map(([w,n])=>`<span class="word" style="font-size:${Math.min(48,20+n*7)}px">${esc(w)}</span>`).join('')+'</div>':(['poll','quiz','scale'].includes(q.type)?Object.entries(rs.reduce((a,r)=>(a[r.answer]=(a[r.answer]||0)+1,a),{})).map(([a,n])=>`<p>${esc(a)} · ${n}</p><div class="bar"><b style="width:${rs.length?Math.round(100*n/rs.length):0}%"></b></div>`).join(''):rs.map(r=>`<div class="answer ${r.featured?'featured':''}">${esc(r.answer)}<div class="muted">${esc(r.display_name||'Anonymous')} ${q.type==='qa'?'· '+r.votes+' upvotes':''}</div>${q.type==='qa'?`<button class="btn soft" data-vote="${r.id}">▲ Upvote</button>`:''}</div>`).join(''))||notice('Responses will appear here when approved or submitted.') }<p class="muted">${q&&q.visibility!=='private'?rs.length+' visible responses':''}</p></section>`}catch(e){app.innerHTML=notice(e.message)}}
if(view==='facilitator'){adminView();setInterval(()=>{if($('#refresh'))adminView()},6000)}else if(view==='screen'){screenView();setInterval(screenView,5000)}else{participantView();setInterval(async()=>{try{const j=await api('join?code='+CODE);if(j.question?.id!==activeQuestion?.id)participantView()}catch{}},5000)}
</script></body></html>
